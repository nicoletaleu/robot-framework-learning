<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Internet</title>
</head>
<body>
<!--FLASH-->
<h3>Dynamically Loaded Page Elements</h3>
<h4>Example 2: Element rendered after the fact</h4>
<div id="start"><button>Start</button></div>
<div id="loading" style="display:none">Loading...</div>
<!-- No #finish here on purpose. It does not exist until the script builds it,
     which is what makes "attached" a meaningful wait on this page and not on
     the one next door. -->
<script>
  document.querySelector('#start button').addEventListener('click', function () {
    document.getElementById('start').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    window.setTimeout(function () {
      document.getElementById('loading').style.display = 'none';
      var finish = document.createElement('div');
      finish.id = 'finish';
      finish.innerHTML = '<h4>Hello World!</h4>';
      document.body.appendChild(finish);
    }, 1500);
  });
</script>
</body>
</html>
