# Day 15 - CI: let GitHub run the whole suite on every push.
# A test that only runs on my laptop protects nobody. This workflow reruns
# everything on a clean Ubuntu machine, so a broken test shows up in the repo
# and not two weeks later.
name: robot tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab
  # Day 25: the contract tests call the real API, so they get a slot of their
  # own instead of a place on every push. Nightly is often enough to catch a
  # provider changing shape, and it cannot make a pull request red.
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC, daily

jobs:
  robot:
    runs-on: ubuntu-latest

    steps:
      # The runner starts empty - it knows nothing about my code until I check it out.
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip # reuse downloaded wheels between runs

      # The Browser library is Playwright underneath, and Playwright is Node.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # The browser binaries are the biggest download in this workflow and they
      # only change when robotframework-browser does. requirements.txt is pinned,
      # so hashing it is a precise key: same dependencies, same browsers, cache
      # hit. A miss just downloads them as before.
      - name: Cache the Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      # Downloads Chromium & co. Locally I ran this once; a CI runner is a brand
      # new machine every time, so it has to happen here too.
      - name: Install Playwright browsers
        run: rfbrowser init

      # Day 18: pabot instead of robot. It starts one process per suite, runs four
      # at a time and merges everything into the same results/ folder, so the
      # artifact below is unchanged - only the wall-clock time drops.
      #
      # ${HEADLESS} defaults to True since Day 30, so this is belt and braces
      # rather than a fix: a CI runner has no screen, and headed Chromium would
      # not start at all. Left in place because the day somebody commits
      # HEADLESS:False to watch a run locally, CI should not go red for it.
      #
      # Day 19: --listener attaches RunListener to every worker. It tags anything
      # slower than 2s and writes a per-process listener_summary_*.json into
      # results/, which the artifact below picks up. It also un-skips the two
      # tests in suite 19 that need a live listener to check.
      #
      # Day 23: a pull request runs the smoke set only - fast feedback while the
      # change is still being written. Everything runs on the way into main, and
      # on the manual button. Two steps rather than one clever line, because the
      # thing a workflow most needs to be is readable at a glance.
      - name: Run the smoke tests (pull request)
        if: github.event_name == 'pull_request'
        run: >-
          pabot --processes 4 --outputdir results
          --variable HEADLESS:True
          --listener libraries/RunListener.py:2.0
          --listener libraries/FailureReporter.py
          --skiponfailure quarantine
          --include smoke
          tests/

      # Day 25: --exclude contract. Everything else here runs offline or against
      # a stub, so a push is not at the mercy of somebody else's uptime.
      - name: Run every test except the contract ones (main, or on demand)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: >-
          pabot --processes 4 --outputdir results
          --variable HEADLESS:True
          --listener libraries/RunListener.py:2.0
          --listener libraries/FailureReporter.py
          --skiponfailure quarantine
          --exclude contract
          tests/

      # The other half: does the real service still send what the stubs pretend
      # it sends? A red run here means the stubs have gone stale, not that the
      # change under test is broken - which is why it is on its own schedule.
      - name: Check the contracts against the live API (nightly)
        if: github.event_name == 'schedule'
        run: >-
          pabot --processes 4 --outputdir results
          --variable HEADLESS:True
          --listener libraries/FailureReporter.py
          --skiponfailure quarantine
          --include contract
          tests/

      # Day 27: --skiponfailure quarantine. A test tagged `quarantine` that fails
      # is reported as SKIP instead of FAIL, with the original failure kept in the
      # skip message. It still runs and still reports - the build just stops
      # gating on it. Not --exclude, which would stop it running and take away
      # any chance of noticing it had recovered.
      #
      # Day 26: every run carries FailureReporter, so a red run drops a JSON file
      # per failed test into results/failures/ - which keyword broke, with what
      # values, on what machine. That is the artefact worth reading first.
      #
      # always() = upload even when the tests failed. That is exactly when I need
      # log.html to find out what went wrong.
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results/

  # Two checks that need neither a browser nor the network, kept in their own
  # job so they report separately and run while the suite is still going. Both
  # came out of an outside review; what changed is where they run and how they
  # are pinned.
  checks:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 = the whole history. The default shallow clone has one
      # commit, and a secret that was committed and then deleted is only
      # visible in the commits before the deletion - which is the case worth
      # scanning for at all.
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # robot --dryrun: parses every suite and resolves every keyword and
      # variable without executing anything. Seconds, and it catches the class
      # of mistake that otherwise waits for the line to finally run - a missing
      # library import, a keyword that does not exist, a mistyped variable.
      - name: Dry-run the whole suite
        run: python scripts/lint_robot.py

      # Pinned to an exact version, for the same reason requirements.txt is:
      # `curl | bash` from the installer on master upgrades itself whenever
      # upstream releases, so CI can go red with no change to any file here.
      # A bump is then a commit, with one obvious suspect.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # `git`, not `detect`: detect was removed, and `git` is the mode that
      # reads history rather than only the files as they are now. --redact so a
      # finding does not leak the secret into a public build log.
      - name: Scan the history for secrets
        run: gitleaks git . --redact --no-banner
